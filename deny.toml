# cargo-deny configuration for ragent.
# See https://embarkstudios.github.io/cargo-deny/ for full documentation.
# Schema updated for cargo-deny >=0.19 (older keys like vulnerability/unmaintained removed).

[advisories]
# Ignore advisories for vulnerabilities in transitive deps we cannot directly control.
ignore = [
    # RUSTSEC-2026-0002: lru IterMut violates Stacked Borrows.
    # lru is a transitive dependency of ratatui 0.29; we do not call iter_mut() directly.
    { id = "RUSTSEC-2026-0002", reason = "transitive via ratatui; ragent does not call lru::LruCache::iter_mut()" },
    # RUSTSEC-2024-0436: paste crate no longer maintained.
    # paste is a transitive dep (via ratatui); it continues to work correctly.
    { id = "RUSTSEC-2024-0436", reason = "transitive via ratatui; functionality unaffected" },
    # RUSTSEC-2024-0370: proc-macro-error is unmaintained.
    # proc-macro-error is a transitive dep (via ouroboros -> allsorts -> printpdf).
    { id = "RUSTSEC-2024-0370", reason = "transitive via printpdf; functionality unaffected" },
    # RUSTSEC-2024-0384: instant crate no longer maintained.
    # instant is a transitive dep (via measure_time -> tantivy); awaiting upstream update.
    { id = "RUSTSEC-2024-0384", reason = "transitive via tantivy; awaiting upstream update" },
    # RUSTSEC-2025-0119: markdown parser panic (unmaintained pulldown-cmark fork).
    # pulldown-cmark is a transitive dep (via ratatui); no actionable fix available.
    { id = "RUSTSEC-2025-0119", reason = "transitive via ratatui; no fixed version available" },
    # RUSTSEC-2026-0192: ttf-parser unmaintained.
    # ttf-parser is a transitive dep (via printpdf); functionality unaffected.
    { id = "RUSTSEC-2026-0192", reason = "transitive via printpdf; functionality unaffected" },
    # RUSTSEC-2026-0190: anyhow downcast_mut unsoundness.
    # anyhow is a transitive dep widely used; awaiting upstream fix.
    { id = "RUSTSEC-2026-0190", reason = "transitive; awaiting upstream fix" },
    # RUSTSEC-2026-0187: lopdf stack overflow via deeply nested PDF objects.
    # lopdf 0.39 is a direct dep; upgrade to 0.42+ requires ooxmlsdk/quick-xml break.
    { id = "RUSTSEC-2026-0187", reason = "direct dep blocked by ooxmlsdk/quick-xml compatibility; trusted PDF input" },
    # RUSTSEC-2026-0194: quick-xml quadratic duplicate-attribute check.
    # quick-xml 0.39 is a direct dep; upgrade blocked by ooxmlsdk 0.3 compatibility.
    { id = "RUSTSEC-2026-0194", reason = "direct dep blocked by ooxmlsdk compatibility; trusted XML input" },
    # RUSTSEC-2026-0195: quick-xml unbounded namespace declarations.
    # Same compatibility constraint as RUSTSEC-2026-0194.
    { id = "RUSTSEC-2026-0195", reason = "direct dep blocked by ooxmlsdk compatibility; trusted XML input" },
    # RUSTSEC-2026-0185: quinn-proto remote memory exhaustion from unbounded
    # out-of-order stream reassembly. Transitive via reqwest/h3; awaiting upstream fix.
    { id = "RUSTSEC-2026-0185", reason = "transitive via reqwest/h3; awaiting upstream fix" },
    # RUSTSEC-2026-0235: rkyv insufficient archive validation causing out-of-bounds reads.
    # rkyv is a transitive dep; upgrade to >=0.8.17 is blocked by downstream crates.
    { id = "RUSTSEC-2026-0235", reason = "transitive; upgrade blocked by downstream compatibility" },
    # RUSTSEC-2025-0052: async-std has been discontinued.
    # async-std is pulled in by opentelemetry_sdk 0.28; upgrading OTEL is tracked separately.
    { id = "RUSTSEC-2025-0052", reason = "transitive via opentelemetry_sdk 0.28; upgrade tracked separately" },
    # RUSTSEC-2026-0253: lru LruCache::pop() use-after-free due to lack of panic safety.
    # lru 0.12.5 is a transitive dep (via ratatui 0.29, tantivy 0.22); ragent does not call pop().
    # Fixed in lru 0.18.2 but ratatui 0.29 pins lru 0.12.
    { id = "RUSTSEC-2026-0253", reason = "transitive via ratatui 0.29 / tantivy 0.22; ragent does not call LruCache::pop(); upgrade blocked by ratatui" },
]

[licenses]
# Only allow these license families.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    # webpki-roots uses CDLA-Permissive-2.0 (Community Data License Agreement — permissive).
    "CDLA-Permissive-2.0",
]

# ring uses a custom ISC-style license.
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Warn on multiple versions of the same crate (common in large trees).
multiple-versions = "warn"
# Warn on wildcard deps (workspace-internal path deps are flagged here; deny for external wildcards
# is enforced by convention rather than this setting to avoid false-positives on workspace members).
wildcards = "warn"

[sources]
# Only allow crates from crates.io and local paths.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies are allowed; all third-party crates come from crates.io.
allow-git = []
