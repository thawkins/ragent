# cargo-deny configuration for ragent.
# See https://embarkstudios.github.io/cargo-deny/ for full documentation.
# Schema updated for cargo-deny >=0.19 (older keys like vulnerability/unmaintained removed).

[advisories]
# Report `informational = "unsound"` advisories as failures too (default is
# "none", which silently skips them). This is what makes the RUSTSEC-2026-0253
# `lru` entry below an *enforced* suppression instead of an undetected one.
unsound = "all"
# Ignore advisories for vulnerabilities in transitive deps we cannot directly control.
ignore = [
    # (RUSTSEC-2026-0002 is no longer ignored: the affected lru 0.12.5 copy is
    #  gone, and the remaining 0.16.4 copy pulled by tantivy is >= the 0.16.3
    #  patched floor.)
    # (RUSTSEC-2024-0384 is no longer ignored: `instant` is absent from the
    #  current tree; the notify-types dependency line that pulled it is gone.)
    # (RUSTSEC-2025-0134 is no longer ignored: rustls-pemfile is absent now that
    #  the opentelemetry-otlp / tonic migration moved off tonic 0.12.)
    # (RUSTSEC-2026-0187 is no longer ignored: the affected lopdf 0.39 copy is
    #  gone; the tree now carries lopdf 0.44.0, above the >= 0.42.0 patched
    #  floor.)
    # (RUSTSEC-2026-0192 is no longer ignored: ttf-parser is absent from the
    #  current tree.)
    # RUSTSEC-2026-0194: quick-xml quadratic duplicate-attribute check.
    # quick-xml 0.39 is a direct dep; upgrade blocked by ooxmlsdk 0.3 compatibility.
    { id = "RUSTSEC-2026-0194", reason = "direct dep blocked by ooxmlsdk compatibility; trusted XML input" },
    # RUSTSEC-2026-0195: quick-xml unbounded namespace declarations.
    # Same compatibility constraint as RUSTSEC-2026-0194.
    { id = "RUSTSEC-2026-0195", reason = "direct dep blocked by ooxmlsdk compatibility; trusted XML input" },
    # RUSTSEC-2026-0253: lru LruCache::pop() use-after-free due to lack of panic safety.
    # ragent's direct lru is 0.18 (fixed) and ratatui 0.30 / printpdf 0.12
    # pull lru >= 0.18; the remaining 0.16.4 copy is pinned by tantivy 0.26,
    # whose latest release still requires lru ^0.16.3 (fixed only in 0.18.2).
    # ragent never calls LruCache::pop().
    { id = "RUSTSEC-2026-0253", reason = "remaining copy pinned by tantivy 0.26 (requires lru ^0.16.3); ragent never calls LruCache::pop()" },
]

[licenses]
# Only allow these license families.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    # webpki-roots uses CDLA-Permissive-2.0 (Community Data License Agreement — permissive).
    "CDLA-Permissive-2.0",
]

# ring uses a custom ISC-style license.
[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Warn on multiple versions of the same crate (common in large trees).
multiple-versions = "warn"
# Warn on wildcard deps (workspace-internal path deps are flagged here; deny for external wildcards
# is enforced by convention rather than this setting to avoid false-positives on workspace members).
wildcards = "warn"

[sources]
# Only allow crates from crates.io and local paths.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies are allowed; all third-party crates come from crates.io.
allow-git = []
