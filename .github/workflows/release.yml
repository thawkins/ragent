name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - Linux-x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set asset name
        shell: bash
        run: |
          echo "ASSET_NAME=ragent-${{ github.ref_name }}-linux-x86_64" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            fakeroot \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cp "target/x86_64-unknown-linux-gnu/release/ragent" "${{ env.ASSET_NAME }}"

      - name: Install packaging tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build .deb package
        run: |
          cargo deb --target x86_64-unknown-linux-gnu --no-build --output "ragent-${{ github.ref_name }}-linux-x86_64.deb"

#      - name: Build .rpm package
#        run: |
#          cargo generate-rpm --target x86_64-unknown-linux-gnu --output "ragent-${{ github.ref_name }}-linux-x86_64.rpm"

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          version="${{ env.VERSION }}"
          python3 -c '
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md").read()
          pat = re.compile(r"^## Version: " + re.escape(ver) + r"\b.*?(?=^## Version: |\\Z)", re.M | re.S)
          m = pat.search(text)
          open("release_notes.md", "w").write(m.group(0) if m else "")
          ' "$version"

          if [[ -s release_notes.md ]]; then
            echo "Found release notes for version $version"
          else
            echo "No CHANGELOG section found for version $version; release body will be empty."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ragent-${{ github.ref_name }}-linux-x86_64
          path: |
            ${{ env.ASSET_NAME }}
            *.deb
#            *.rpm
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            ${{ env.ASSET_NAME }}
            *.deb
#            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
