name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        # Ignore advisories that are blocked by upstream compatibility or are transitive deps
        # without a fixed version. Keep these in sync with deny.toml [advisories].ignore.
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2024-0384
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2025-0052
          --ignore RUSTSEC-2025-0119
          --ignore RUSTSEC-2026-0002
          --ignore RUSTSEC-2026-0185
          --ignore RUSTSEC-2026-0187
          --ignore RUSTSEC-2026-0190
          --ignore RUSTSEC-2026-0192
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
          --ignore RUSTSEC-2026-0235

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check
