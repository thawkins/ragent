# cargo-audit configuration for ragent.
# These advisories are suppressed because fixing them requires major upstream
# crate upgrades that are currently blocked by compatibility.
[advisories]
ignore = [
    "RUSTSEC-2026-0187", # lopdf stack overflow; blocked by pdf-extract/printpdf versions
    "RUSTSEC-2026-0194", # quick-xml duplicate attr check; blocked by ooxmlsdk/calamine
    "RUSTSEC-2026-0195", # quick-xml namespace allocation; blocked by ooxmlsdk/calamine
    "RUSTSEC-2026-0235", # rkyv archive validation; blocked by rust_decimal via spreadsheet-ods
]
