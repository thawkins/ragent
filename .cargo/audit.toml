# cargo-audit configuration for ragent.
# Kept in sync with deny.toml: only advisories that still apply to the current
# dependency tree are listed here, so a re-introduced vulnerable crate is never
# silently masked.
[advisories]
ignore = [
    "RUSTSEC-2026-0194", # quick-xml duplicate attr check; blocked by ooxmlsdk/calamine
    "RUSTSEC-2026-0195", # quick-xml namespace allocation; blocked by ooxmlsdk/calamine
    "RUSTSEC-2024-0436", # paste unmaintained; transitive via tokenizers 0.21 (embeddings feature)
    "RUSTSEC-2026-0253", # lru pop() panic safety; remaining copy pinned by tantivy; pop never called
]
