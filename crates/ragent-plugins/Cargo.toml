[package]
name = "ragent-plugins"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Plugin system for ragent: discovery, descriptor model, sandboxed runtime, and lifecycle (spec `plugins`)"

[features]
default = []

[dependencies]
ragent-config = { path = "../ragent-config" }
ragent-tools-core = { path = "../ragent-tools-core" }
async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
zip = { workspace = true }
flate2 = "1"
tar = "0.4"
reqwest = { workspace = true, features = ["blocking"] }
rquickjs = "0.10"

[dev-dependencies]
zip = { workspace = true }
flate2 = "1"
tar = "0.4"

[lints]
workspace = true
