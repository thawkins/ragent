[package]
name = "ragent-tools-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "Essential file, shell, and search tools for ragent"
repository = "https://github.com/thawkins/ragent"

[dependencies]
ragent-types = { path = "../ragent-types" }
ragent-config = { path = "../ragent-config" }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
rust_xlsxwriter = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# File operations
globset = { workspace = true }
similar = { workspace = true }
lru = { workspace = true }

# Search tools
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }

# Shell utilities
which = "7.0"

# Unix process-group signalling (killpg) for killing orphaned test binaries on timeout
libc = { workspace = true }

# Utilities
chrono = { workspace = true }
dirs = "6"

[dev-dependencies]
tempfile = "3.14"
filetime = "0.2"

[lints]
workspace = true
