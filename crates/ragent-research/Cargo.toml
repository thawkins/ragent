[package]
name = "ragent-research"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Research system for ragent: structured research items with web and local source capture"

[dependencies]
ragent-types = { path = "../ragent-types" }
ragent-config = { path = "../ragent-config" }
ragent-llm = { path = "../ragent-llm" }
ragent-storage = { path = "../ragent-storage" }

async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
rusqlite = { workspace = true }
ragent-tools-extended = { path = "../ragent-tools-extended" }
reqwest = { workspace = true }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
similar = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
ragent-specs = { path = "../ragent-specs" }
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }
proptest = "1"

[build-dependencies]
chrono = { workspace = true }

[[bench]]
name = "gathering_bench"
harness = false

[[bench]]
name = "researchext_bench"
harness = false

[[bench]]
name = "gatherer_bench"
harness = false
