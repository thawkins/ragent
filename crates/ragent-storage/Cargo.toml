[package]
name = "ragent-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "SQLite persistence layer for ragent sessions, memories, journals, snapshots, and teams"
repository = "https://github.com/thawkins/ragent"

[dependencies]
ragent-types = { path = "../ragent-types" }

# Core async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Database
rusqlite = { workspace = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
similar = { workspace = true }
blake3 = "1.6"
base64 = { workspace = true }
# SEC-ragent-storage-001 (SECTASKS T-017): AEAD for the credential store
# (replaces the unauthenticated XOR stream cipher).
chacha20poly1305 = "0.10"
uuid = { version = "1.23", features = ["v4", "serde"] }
rand = "0.8"
dirs = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"

[[bench]]
name = "activity_log_bench"
harness = false

[lints]
workspace = true
