[package]
name = "ragent-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "LLM provider implementations for ragent (Anthropic, OpenAI, Gemini, Ollama, HuggingFace, Copilot, Generic OpenAI, Azure AI Foundry, Azure Resource, Amazon Bedrock)"
repository = "https://github.com/thawkins/ragent"

[features]
default = []

[dependencies]
ragent-types = { path = "../ragent-types" }
ragent-config = { path = "../ragent-config" }
ragent-storage = { path = "../ragent-storage" }
async-trait = { workspace = true }

# Core async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-stream = { workspace = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
dirs = "5.0"
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
bytes = "1"

[lints]
workspace = true
