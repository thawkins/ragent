[package]
name = "ragent-tools-extended"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "Extended document, web, memory, and code index tools for ragent"
repository = "https://github.com/thawkins/ragent"

[dependencies]
ragent-codeindex = { path = "../ragent-codeindex" }
ragent-config = { path = "../ragent-config" }
ragent-storage = { path = "../ragent-storage" }
ragent-tools-core = { path = "../ragent-tools-core" }
ragent-types = { path = "../ragent-types" }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }

chrono = { workspace = true }
rand = "0.9"
paft-decimal = "0.9"
paft-money = "0.9"
uuid = { workspace = true }
dirs = { workspace = true }
html2text = { workspace = true }
readability-rs = { workspace = true }
# GPL-3.0 dependency (explicitly accepted by the project owner 2026-09-06):
# scientific/terminal plotting widgets used by the plot_* tools. Added to the
# cargo-deny allow list with the same rationale. `default-features = false`
# avoids pulling in crossterm (we render off-screen to text only).
ratatui-plt = { version = "0.0.2", default-features = false }
# ratatui must match the version ratatui-plt pins (0.30); it is used here only
# for the `Widget` bound + `Color` in the plot_* off-screen renderer. This is a
# second, crate-local ratatui distinct from the workspace 0.29 used by ragent-tui.
ratatui = "0.30"
base64 = { workspace = true }

reqwest = { workspace = true, features = ["cookies", "gzip", "deflate"] }
tokio-tungstenite = { workspace = true }
regex = { workspace = true }
docx-rust = { workspace = true }
yfinance-rs = "0.9.1"
calamine = { workspace = true }
ooxmlsdk = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
spreadsheet-ods = { workspace = true }
printpdf = { workspace = true }
pdf-extract = { workspace = true }
lopdf = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }
lingua = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
axum = { workspace = true }

[dependencies.ort]
workspace = true
optional = true

[dependencies.tokenizers]
workspace = true
optional = true

[dependencies.ndarray]
workspace = true
optional = true

[features]
default = []
embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[package.metadata.cargo-machete]
# readability-rs is used via its lib name `readability` (extractor.rs, webfetch.rs);
# cargo-machete matches on the package name and flags it as unused.
ignored = ["readability-rs"]

[lints]
workspace = true
