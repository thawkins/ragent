[package]
name = "ragent-tools-extended"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "Extended document, web, memory, and code index tools for ragent"
repository = "https://github.com/thawkins/ragent"

[dependencies]
ragent-codeindex = { path = "../ragent-codeindex" }
ragent-config = { path = "../ragent-config" }
ragent-tools-core = { path = "../ragent-tools-core" }
ragent-types = { path = "../ragent-types" }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }

chrono = { workspace = true }
uuid = { workspace = true }
html2text = { workspace = true }
readability-rs = { workspace = true }

reqwest = { workspace = true, features = ["cookies", "gzip", "deflate", "blocking"] }
regex = { workspace = true }
quick-xml = { workspace = true }
printpdf = { workspace = true }
pdf-extract = { workspace = true }
lopdf = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }
lingua = { workspace = true }
# PERF-080: FxHash for short non-adversarial map keys (URLs, engine names).
rustc-hash = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
axum = { workspace = true }
wiremock = "0.6"

[dependencies.ort]
workspace = true
optional = true

[dependencies.tokenizers]
workspace = true
optional = true

[dependencies.ndarray]
workspace = true
optional = true

[features]
default = []
embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
# Spec `openhands` FR-029 (T-017): opt-in bundled headless-browser driver. Off
# by default (no new mandatory runtime dependency, assumption A10). When on,
# `mf_screenshot` is registered only while an engine binary resolves on `PATH`.
headless-browser = []

[package.metadata.cargo-machete]
# readability-rs is used via its lib name `readability` (extractor.rs,
# webfetch.rs); cargo-machete matches on the package name and flags it as
# unused. Keep ignoring it.
ignored = ["readability-rs"]

[lints]
workspace = true
