[package]
name = "ragent-tools-extended"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "Extended document, web, memory, and code index tools for ragent"
repository = "https://github.com/thawkins/ragent"

[dependencies]
ragent-codeindex = { path = "../ragent-codeindex" }
ragent-config = { path = "../ragent-config" }
ragent-storage = { path = "../ragent-storage" }
ragent-tools-core = { path = "../ragent-tools-core" }
ragent-types = { path = "../ragent-types" }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }

chrono = { workspace = true }
rand = "0.9"
paft-decimal = "0.9"
paft-money = "0.9"
uuid = { workspace = true }
dirs = { workspace = true }
html2text = { workspace = true }
readability-rs = { workspace = true }
base64 = { workspace = true }

reqwest = { workspace = true, features = ["cookies", "gzip", "deflate"] }
tokio-tungstenite = { workspace = true }
regex = { workspace = true }
percent-encoding = "2"
docx-rust = { workspace = true }
yfinance-rs = "0.9.1"
calamine = { workspace = true }
rust_xlsxwriter = { workspace = true }
ooxmlsdk = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
spreadsheet-ods = { workspace = true }
printpdf = { workspace = true }
pdf-extract = { workspace = true }
lopdf = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }
lingua = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
axum = { workspace = true }

[dependencies.ort]
workspace = true
optional = true

[dependencies.tokenizers]
workspace = true
optional = true

[dependencies.ndarray]
workspace = true
optional = true

[features]
default = []
embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[lints]
workspace = true
