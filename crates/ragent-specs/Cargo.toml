[package]
name = "ragent-specs"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "Spec management system for ragent: EARS notation specs, validation, and lifecycle tracking"
repository = "https://github.com/thawkins/ragent"

[dependencies]
ragent-types = { path = "../ragent-types" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
regex = "1"
tokio = { version = "1.42", features = ["fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
tempfile = "3"
