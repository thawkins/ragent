[package]
name = "ragent-specs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors = ["Tim Hawkins"]
description = "Spec management system for ragent: EARS notation specs, validation, and lifecycle tracking"
repository = "https://github.com/thawkins/ragent"

autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
# Shared `/new` scaffold flag parser (spec `govdoc` T-002): `/spec govcreate`
# delegates its trailing flags here so accepted values and error text cannot
# drift from the `/new` surface.
ragent-tools-extended = { path = "../ragent-tools-extended" }
serde = { version = "1.0", features = ["derive"] }
# Completion timestamps in PLAN.md status cells are RFC 3339 UTC strings.
chrono = { workspace = true }
thiserror = { workspace = true }
regex = "1"
tokio = { version = "1.42", features = ["fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
tempfile = "3"
serde_json = { workspace = true }

[lints]
workspace = true
