[package]
name = "ragent-specs"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tim Hawkins"]
description = "Spec management system for ragent: EARS notation specs, validation, and lifecycle tracking"
repository = "https://github.com/thawkins/ragent"

[dependencies]
# Shared `/new` scaffold flag parser (spec `govdoc` T-002): `/spec govcreate`
# delegates its trailing flags here so accepted values and error text cannot
# drift from the `/new` surface.
ragent-tools-extended = { path = "../ragent-tools-extended" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1"
regex = "1"
tokio = { version = "1.42", features = ["fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
tempfile = "3"

[lints]
workspace = true
