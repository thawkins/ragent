[package]
name = "ragent-telemetry"
version = "0.1.0"
edition = "2024"
authors = ["Tim Hawkins <tim.thawkins@gmail.com>"]
license = "MIT"
description = "OpenTelemetry metrics export subsystem for ragent"
repository = "https://github.com/thawkins/ragent"

[features]
# The real OpenTelemetry meter provider and OTLP exporters are enabled by
# default. Telemetry is hardwired into the ragent binary; this feature can be
# disabled for a zero-dependency build if absolutely required.
default = ["telemetry"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies]
ragent-config = { path = "../ragent-config" }

serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }

# Optional OTEL dependencies — only pulled in when the `telemetry` feature is
# enabled, satisfying NFR-006 (users who do not need OTEL can build without
# these crates).
opentelemetry = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", optional = true, features = [
    "metrics",
    "rt-tokio",
] }
opentelemetry-otlp = { version = "0.29", optional = true, default-features = false, features = [
    "metrics",
    "http-proto",
    "reqwest-client",
    "grpc-tonic",
    # SEC-ragent-telemetry-001 (SECTASKS T-019): without `tonic/tls` an
    # `https://host:4317` gRPC endpoint is dialled in cleartext, so the OTLP
    # payload leaves the machine unencrypted while the configuration looks
    # secure.
    "tls-roots",
] }

[dev-dependencies]
tokio = { workspace = true }
opentelemetry = { version = "0.29" }
# NOTE: do not enable opentelemetry_sdk's `testing` feature. It drags in
# `rt-async-std` -> the discontinued `async-std` crate (RUSTSEC-2025-0052).
# The `InMemoryMetricExporter` used by the telemetry tests is not feature-gated
# (it lives in the always-present `metrics::in_memory_exporter` module), and
# `testing` only adds async-std/trace/logs wiring we do not use.
opentelemetry_sdk = { version = "0.29", features = ["metrics", "rt-tokio", "testing"] }

[lints]
workspace = true