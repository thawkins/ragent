<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAgent - AI Coding Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #16213e;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #e94560;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a4a4a;
        }

        .status-dot.connected {
            background: #4ade80;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #0f3460;
        }

        .sidebar-header h2 {
            font-size: 1rem;
            color: #e94560;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .session-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.25rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .session-item:hover {
            background: #0f3460;
        }

        .session-item.active {
            background: #e94560;
            color: white;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .message {
            margin-bottom: 1.5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .message-user .message-header {
            color: #4ade80;
        }

        .message-assistant .message-header {
            color: #e94560;
        }

        .message-content {
            background: #16213e;
            padding: 1rem;
            border-radius: 8px;
            line-height: 1.6;
        }

        .message-content pre {
            background: #0f3460;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .message-content code {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
        }

        .input-area {
            border-top: 1px solid #0f3460;
            padding: 1rem 1.5rem;
            background: #16213e;
        }

        .input-form {
            display: flex;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .message-input {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #eaeaea;
            font-size: 1rem;
            resize: none;
        }

        .message-input:focus {
            outline: none;
            border-color: #e94560;
        }

        .send-button {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #ff6b6b;
        }

        .send-button:disabled {
            background: #4a4a4a;
            cursor: not-allowed;
        }

        .new-session-btn {
            background: #0f3460;
            color: #e94560;
            border: 1px solid #e94560;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .new-session-btn:hover {
            background: #e94560;
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e94560;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tool-call {
            background: #0f3460;
            border-left: 3px solid #e94560;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 RAgent</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Sessions</h2>
                <button class="new-session-btn" onclick="createNewSession()" style="margin-top: 0.5rem; width: 100%;">
                    + New Session
                </button>
            </div>
            <div class="session-list" id="sessionList">
                <!-- Sessions loaded dynamically -->
            </div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Messages loaded dynamically -->
            </div>

            <div class="input-area">
                <form class="input-form" onsubmit="sendMessage(event)">
                    <textarea
                        class="message-input"
                        id="messageInput"
                        placeholder="Type your message..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button type="submit" class="send-button" id="sendButton">
                        Send
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentSession = null;
        let eventSource = null;
        let authToken = localStorage.getItem('ragent_token') || '';

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            loadSessions();
            connectSSE();
        });

        // Connect to SSE stream
        function connectSSE() {
            if (eventSource) {
                eventSource.close();
            }

            const url = `/events?session=${currentSession || ''}`;
            eventSource = new EventSource(url);

            eventSource.onopen = () => {
                updateStatus(true);
            };

            eventSource.onerror = () => {
                updateStatus(false);
                setTimeout(connectSSE, 3000);
            };

            eventSource.addEventListener('message', (e) => {
                const data = JSON.parse(e.data);
                appendMessage('user', data.content);
            });

            eventSource.addEventListener('assistant_message', (e) => {
                const data = JSON.parse(e.data);
                appendMessage('assistant', data.content);
            });

            eventSource.addEventListener('tool_call_start', (e) => {
                const data = JSON.parse(e.data);
                appendToolCall(data.tool, data.call_id);
            });

            eventSource.addEventListener('tool_call_end', (e) => {
                const data = JSON.parse(e.data);
                updateToolCall(data.call_id, data.error);
            });
        }

        // Load sessions list
        async function loadSessions() {
            try {
                const response = await fetch('/sessions', {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const sessions = await response.json();
                renderSessionList(sessions);
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        // Render session list
        function renderSessionList(sessions) {
            const list = document.getElementById('sessionList');
            list.innerHTML = '';

            sessions.forEach(session => {
                const item = document.createElement('div');
                item.className = 'session-item' + (session.id === currentSession ? ' active' : '');
                item.textContent = session.name || session.id.substring(0, 8) + '...';
                item.onclick = () => selectSession(session.id);
                list.appendChild(item);
            });
        }

        // Select a session
        async function selectSession(sessionId) {
            currentSession = sessionId;
            renderSessionList(await getSessions());
            loadMessages(sessionId);
            connectSSE();
        }

        // Get sessions (helper)
        async function getSessions() {
            const response = await fetch('/sessions', {
                headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
            });
            return await response.json();
        }

        // Create new session
        async function createNewSession() {
            try {
                const response = await fetch('/sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {})
                    },
                    body: JSON.stringify({
                        name: `Session ${new Date().toLocaleString()}`,
                        agent: 'general'
                    })
                });
                const session = await response.json();
                loadSessions();
                selectSession(session.id);
            } catch (error) {
                console.error('Failed to create session:', error);
            }
        }

        // Load messages for a session
        async function loadMessages(sessionId) {
            try {
                const response = await fetch(`/sessions/${sessionId}/messages`, {
                    headers: authToken ? { 'Authorization': `Bearer ${authToken}` } : {}
                });
                const messages = await response.json();
                renderMessages(messages);
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        // Render messages
        function renderMessages(messages) {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            messages.forEach(msg => {
                appendMessage(msg.role, msg.content, false);
            });

            container.scrollTop = container.scrollHeight;
        }

        // Append a message
        function appendMessage(role, content, scroll = true) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `message message-${role}`;

            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = role === 'user' ? '👤 You' : '🤖 Assistant';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = formatContent(content);

            div.appendChild(header);
            div.appendChild(contentDiv);
            container.appendChild(div);

            if (scroll) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // Append tool call indicator
        function appendToolCall(tool, callId) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'tool-call';
            div.id = `tool-${callId}`;
            div.textContent = `⚙️ Running ${tool}...`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Update tool call status
        function updateToolCall(callId, error) {
            const el = document.getElementById(`tool-${callId}`);
            if (el) {
                if (error) {
                    el.textContent += ` ❌ ${error}`;
                    el.classList.add('error-message');
                } else {
                    el.textContent += ' ✓';
                }
            }
        }

        // Format content (basic markdown-like formatting)
        function formatContent(content) {
            // Escape HTML
            let formatted = content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Code blocks
            formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');

            // Inline code
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // Line breaks
            formatted = formatted.replace(/\n/g, '<br>');

            return formatted;
        }

        // Send message
        async function sendMessage(event) {
            event.preventDefault();

            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !currentSession) return;

            const button = document.getElementById('sendButton');
            button.disabled = true;
            button.innerHTML = '<span class="loading"></span>';

            try {
                await fetch(`/sessions/${currentSession}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(authToken ? { 'Authorization': `Bearer ${authToken}` } : {})
                    },
                    body: JSON.stringify({ content })
                });

                input.value = '';
                appendMessage('user', content);
            } catch (error) {
                console.error('Failed to send message:', error);
            } finally {
                button.disabled = false;
                button.textContent = 'Send';
            }
        }

        // Handle Enter key
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage(event);
            }
        }

        // Update connection status
        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (connected) {
                dot.className = 'status-dot connected';
                text.textContent = 'Connected';
            } else {
                dot.className = 'status-dot disconnected';
                text.textContent = 'Disconnected';
            }
        }
    </script>
</body>
</html>
