[package]
name = "ragent-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
num_cpus = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
fs2 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
globset = { workspace = true }
glob = { workspace = true }
html2text = { workspace = true }
similar = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
pin-project-lite = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
foundry-local-sdk = "1.2.3"
rmcp = { workspace = true }
docx-rust = { workspace = true }
calamine = { workspace = true }
rust_xlsxwriter = { workspace = true }
ooxmlsdk = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
spreadsheet-ods = { workspace = true }
printpdf = { workspace = true }
pdf-extract = { workspace = true }
lopdf = { workspace = true }
serde_yaml = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
dashmap = { workspace = true }
lru = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }
ragent-codeindex = { path = "../ragent-codeindex" }
ragent-config = { path = "../ragent-config" }
ragent-llm = { path = "../ragent-llm" }
ragent-storage = { path = "../ragent-storage" }
ragent-tools-core = { path = "../ragent-tools-core" }
ragent-tools-extended = { path = "../ragent-tools-extended" }
ragent-tools-vcs = { path = "../ragent-tools-vcs" }
ragent-types = { path = "../ragent-types" }
ragent-specs = { path = "../ragent-specs" }

[features]
default = []
embeddings = ["ort", "tokenizers", "ndarray"]
embedded-llm = ["ragent-llm/embedded-llm"]
# ── Context compression (Headroom integration) ───────────────────────
# Enables content-aware compression, CCR reversible storage, accurate
# token counting, and relevance filtering via the headroom-core crate.
# Requires building with: cargo build -p ragent-agent --features compression
compression = ["dep:headroom-core"]
# Enables ML-based content detection and text compression (magika, kompress).
# Requires: cargo build -p ragent-agent --features compression,compression-ml
# Note: compression-ml currently does not add additional crate features
# because headroom-core does not yet feature-gate its ML dependencies.
# This feature flag is reserved for future use when headroom-core adds
# feature flags for its heavier ML dependencies (fastembed, magika).
compression-ml = ["compression"]

[dependencies.ort]
version = "2.0.0-rc.12"
features = ["download-binaries", "load-dynamic"]
optional = true

[dependencies.tokenizers]
version = "0.21"
features = ["onig"]
optional = true

[dependencies.ndarray]
version = "0.17"
optional = true

[dependencies.headroom-core]
git = "https://github.com/chopratejas/headroom.git"
tag = "v0.10.17"
optional = true

[dev-dependencies]
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tempfile = "3.5"
criterion = { version = "0.5", features = ["async_tokio"] }
serial_test = "3.2"

[[bench]]
name = "agent_loop"
harness = false
