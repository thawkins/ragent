[package]
name = "ragent-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
num_cpus = { workspace = true }
sha2 = { workspace = true }
fs2 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
globset = { workspace = true }
html2text = { workspace = true }
similar = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
rmcp = { workspace = true }
serde_yaml = { workspace = true }
url = { workspace = true }
readability-rs = { workspace = true }
ignore = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
# PERF-031: FxHash for non-cryptographic cache keys.
rustc-hash = { workspace = true }
ragent-codeindex = { path = "../ragent-codeindex" }
ragent-config = { path = "../ragent-config" }
ragent-llm = { path = "../ragent-llm" }
ragent-research = { path = "../ragent-research" }
ragent-storage = { path = "../ragent-storage" }
ragent-tools-core = { path = "../ragent-tools-core" }
ragent-tools-extended = { path = "../ragent-tools-extended" }
ragent-tools-vcs = { path = "../ragent-tools-vcs" }
ragent-types = { path = "../ragent-types" }
ragent-specs = { path = "../ragent-specs" }
ragent-telemetry = { path = "../ragent-telemetry" }

[features]
default = []

[package.metadata.cargo-machete]
# readability-rs is used via its lib name `readability` (research_adapter.rs);
# cargo-machete matches on the package name and flags it as unused.
ignored = ["readability-rs"]

[dependencies.flate2]
version = "1.0"

[dependencies.tar]
version = "0.4"

[dependencies.walkdir]
version = "2.3"

[dependencies.tempfile]
version = "3.5"

[dev-dependencies]
anyhow = { workspace = true }
tempfile = "3.5"
criterion = { version = "0.5", features = ["async_tokio"] }
[[bench]]
name = "agent_loop"
harness = false
