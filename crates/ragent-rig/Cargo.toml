[package]
name = "ragent-rig"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rig framework adapter for ragent: provider, streaming, memory, embeddings, and vector-store integration"

[features]
default = ["provider-openai"]
# Provider features pull in rig-core and async-stream (used by the streaming
# closures that synthesise RigStreamChunk streams from Rig responses).
provider-openai = ["dep:rig-core", "dep:async-stream"]
provider-anthropic = ["dep:rig-core", "dep:async-stream"]
provider-gemini = ["dep:rig-core", "dep:async-stream"]
provider-cohere = ["dep:rig-core"]
provider-deepseek = ["dep:rig-core"]
provider-groq = ["dep:rig-core"]
provider-huggingface = ["dep:rig-core"]
provider-mistral = ["dep:rig-core"]
provider-ollama = ["dep:rig-core", "dep:async-stream"]
provider-perplexity = ["dep:rig-core"]
provider-together = ["dep:rig-core"]
provider-xai = ["dep:rig-core"]
memory = ["dep:rig-core"]
embeddings = ["dep:rig-core"]
vector-store-sqlite = ["embeddings", "dep:rusqlite"]
vector-store-memory = ["embeddings"]
vector-store-http = ["embeddings", "dep:reqwest"]
vcr = []
mock = ["dep:rig-core"]
codeindex = ["dep:ragent-codeindex"]
rig-semantic = ["codeindex", "embeddings", "vector-store-memory", "vector-store-sqlite", "vector-store-http"]
research = ["dep:ragent-research", "embeddings", "vector-store-memory", "vector-store-sqlite", "vector-store-http"]
# T-010 / FR-010: Rig-backed semantic search over structured memories.
# `ragent-storage` and `ragent-agent` are already unconditional deps, so this
# feature only needs to pull in the embedding + vector-store backends.
memory-semantic = ["embeddings", "vector-store-memory", "vector-store-sqlite", "vector-store-http"]

[dependencies]
ragent-types = { path = "../ragent-types" }
ragent-config = { path = "../ragent-config" }
ragent-llm = { path = "../ragent-llm" }
ragent-agent = { path = "../ragent-agent" }
ragent-storage = { path = "../ragent-storage" }
ragent-codeindex = { path = "../ragent-codeindex", optional = true }
ragent-research = { path = "../ragent-research", optional = true }

# Rig core is pinned to a specific version range because Rig warns of future
# breaking changes. See FR-033 and the spec for the upgrade policy.
rig-core = { version = "0.9", optional = true }
# async-stream provides the `stream!` macro used to build RigStreamChunk
# streams from Rig's non-streaming `completion()` responses.
async-stream = { workspace = true, optional = true }

# Optional vector-store backends.
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
[[test]]
name = "mock_model_test"
path = "tests/mock_model_test.rs"
required-features = ["mock"]

[[test]]
name = "vcr_test"
path = "tests/vcr_test.rs"
required-features = ["vcr", "mock"]

[[test]]
name = "provider_loop_test"
path = "tests/provider_loop_test.rs"
required-features = ["mock", "provider-openai"]
