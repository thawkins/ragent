[lints]
workspace = true

[build-dependencies]
chrono = { workspace = true }

[dependencies]
ragent-agent = { path = "../ragent-agent" }
ragent-bench = { path = "../ragent-bench" }
ragent-team = { path = "../ragent-team" }
ragent-config = { path = "../ragent-config" }
ragent-types = { path = "../ragent-types" }
ragent-storage = { path = "../ragent-storage" }
ragent-codeindex = { path = "../ragent-codeindex" }
# Direct dep for bash safe-command/builtin-list helpers (source-of-truth); the
# agent-local crate::tool::bash copy is a dormant duplicate (DCREMOVALPLAN M2.3).
ragent-tools-core = { path = "../ragent-tools-core" }
ragent-tools-extended = { path = "../ragent-tools-extended" }
ragent-tools-vcs = { path = "../ragent-tools-vcs" }
ragent-server = { path = "../ragent-server" }
ragent-telemetry = { path = "../ragent-telemetry" }
axum = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
html2text = { workspace = true }
pulldown-cmark = "0.12"
ragent-prompt_opt = { path = "../ragent-prompt_opt" }
ragent-specs = { path = "../ragent-specs" }
ragent-research = { path = "../ragent-research" }
ragent-llm = { path = "../ragent-llm" }
async-trait = { workspace = true }
fs2 = { workspace = true }
lru = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# Kept for backward compatibility; telemetry is now enabled by default.
telemetry = []

[dev-dependencies]
tempfile = "3.5"
criterion = { workspace = true }
parking_lot = { workspace = true }
filetime = "0.2"

[[bench]]
name = "bench_markdown"
harness = false

[[bench]]
name = "bench_cursor"
harness = false

[[bench]]
name = "bench_history"
harness = false

[dependencies.tempfile]
version = "3.5"
