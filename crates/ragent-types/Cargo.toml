[package]
name = "ragent-types"
version = "0.1.0"
edition = "2024"
authors = ["Tim Hawkins"]
license = "MIT"
description = "Core types and traits for ragent"

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
memchr = "2"
rusqlite = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serial_test = "4"
tempfile = "3.14"

[lints]
workspace = true
